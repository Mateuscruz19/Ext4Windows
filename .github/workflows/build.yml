name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download, verify, and install WinFsp 2.1.25156
        shell: pwsh
        run: ./scripts/install-winfsp.ps1 -Install

      - name: Configure
        run: cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DEXT4W_RELEASE_VERSION=1.2.1-r8.1 -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        working-directory: build/tests
        run: ctest --output-on-failure --exclude-regex "blockdev"
